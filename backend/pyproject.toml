[project]
name = "closeller-backend"
version = "0.1.0"
description = "CLOSELLER 1차 MVP 백엔드 (AWS Lambda, Python). 검증·정규화·분류 등 순수 로직을 핸들러와 분리한다."
requires-python = ">=3.11"

# 런타임 의존성. 실제 버전 고정은 배포 단계에서 조정한다.
dependencies = [
    "boto3",
]

[project.optional-dependencies]
# 개발·테스트 전용 의존성. 테스트 프레임워크는 pytest, 속성 기반 테스트는 hypothesis를 사용한다(design.md 참조).
dev = [
    "pytest",
    "hypothesis",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# pytest 설정
# - 테스트는 backend/tests/ 아래에서 수집한다.
# - src/ 를 import 경로에 추가해 `import closeller` 형태로 순수 모듈을 가져온다.
# - 각 속성 테스트는 최소 100회 반복한다(hypothesis 기본 설정은 테스트별 @settings로 보강).
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"
