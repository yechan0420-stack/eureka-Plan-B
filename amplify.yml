# CLOSELLER 프론트엔드 - AWS Amplify Hosting 빌드 설정 (Req 20.7)
#
# frontend/ 디렉터리의 Vite + React + TypeScript 앱을 Amplify Hosting으로
# 빌드한다. 모노레포 형식(applications + appRoot)을 사용한다.
#   - preBuild: npm ci 로 의존성 설치
#   - build: npm run build (tsc -b && vite build)
#   - artifacts.baseDirectory: dist (Vite 기본 출력 디렉터리)
#   - cache: node_modules 캐시
version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
